<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container">
    <a class="navbar-brand" href="index.html">Smart Campus</a>
  </div>
</nav>

<section class="container py-5">
  <h2 class="text-center mb-4">Contact Us</h2>

  <form class="contact-form shadow p-4 bg-white rounded">
    <input class="form-control mb-3" placeholder="Name" required>
    <input class="form-control mb-3" placeholder="Email" required>
    <textarea class="form-control mb-3" rows="4"></textarea>
    <button class="btn btn-primary w-100">Send</button>
  </form>
</section>

<footer class="bg-dark text-white text-center p-3">© 2026 Smart Campus</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.querySelector("form").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Message Sent Successfully!");
  });
</script>

</body>
</html>
