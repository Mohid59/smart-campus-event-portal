name: CD Pipeline - QA

on:
  workflow_run:
    workflows: ["CI Pipeline - Staging/QA"]  # must match CI workflow name
    branches:
      - release/**      # any release branch triggers QA
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - feature/**

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to Render QA
        run: |
          RENDER_URL="${{ secrets.RENDER_CALLBACK_URL_QA || secrets.RENDER_CALLBACK_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "::error::Secret RENDER_CALLBACK_URL_QA or RENDER_CALLBACK_URL is empty or missing!"
            exit 1
          fi

          echo "Triggering Render deploy for QA..."
          curl -X POST "$RENDER_URL"