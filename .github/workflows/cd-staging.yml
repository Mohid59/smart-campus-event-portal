name: CD Pipeline - QA

on:
  workflow_run:
    workflows: ["CI Pipeline - Staging/QA"]
    types:
      - completed
  workflow_dispatch:   # optional manual trigger

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Debug Info
        run: |
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Deploy to Render QA
        run: |
          if [ -z "${{ secrets.RENDER_CALLBACK_URL_QA }}" ]; then
            echo "::error::Secret RENDER_CALLBACK_URL_QA is missing!"
            exit 1
          fi

          echo "Triggering Render deploy for QA..."
          curl -X POST "${{ secrets.RENDER_CALLBACK_URL_QA }}"